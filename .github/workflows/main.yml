name: Windows Cloud PC - Anydesk (Fixed)

on:
  workflow_dispatch:
    inputs:
      anydesk_password:
        description: 'Senha para conectar no AnyDesk (mínimo 8 caracteres)'
        required: true
        default: 'SenhaForte123!'

jobs:
  build:
    name: Start Cloud PC
    runs-on: windows-latest
    timeout-minutes: 360  # Limite máximo real permitido pelo GitHub Actions (6 horas)

    steps:
      - name: Instalar AnyDesk
        run: |
          Write-Host "Baixando e instalando o AnyDesk oficial..."
          winget install --id AnyDeskSoftwareGmbH.AnyDesk -e --accept-source-agreements --accept-package-agreements --silent

      - name: Configurar e Iniciar AnyDesk
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          
          # Verifica se o programa realmente foi instalado antes de continuar
          if (-not (Test-Path $anydeskPath)) {
            Write-Error "ERRO: O AnyDesk não foi encontrado após a instalação. Abortando workflow."
            exit 1
          }

          # Inicia o serviço do AnyDesk
          Start-Process -FilePath $anydeskPath
          Start-Sleep -Seconds 10

          # Define a senha informada ao iniciar o workflow
          $senha = "${{ github.event.inputs.anydesk_password }}"
          echo $senha | & $anydeskPath --set-password
          Start-Sleep -Seconds 5

          # Obtém e exibe o ID no log do GitHub para você conectar
          $id = & $anydeskPath --get-id
          Write-Host "=========================================="
          Write-Host "ANYDESK PRONTO PARA CONEXAO!"
          Write-Host "ID: $id"
          Write-Host "SENHA: $senha"
          Write-Host "=========================================="

      - name: Monitorar Sessão (Máximo 5h45m)
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          # Roda por 345 minutos (5h45m) para encerrar de forma limpa antes do corte de 6h do GitHub
          $tempoLimite = (Get-Date).AddMinutes(345)

          while ((Get-Date) -lt $tempoLimite) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $process) {
              Write-Host "AnyDesk fechou inesperadamente. Reiniciando..."
              Start-Process -FilePath $anydeskPath
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Tempo limite da sessão atingido. Encerrando máquina virtual."

