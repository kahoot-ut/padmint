name: Windows Cloud PC - Anydesk (Direct Download)

on:
  workflow_dispatch:
    inputs:
      anydesk_password:
        description: 'Senha para conectar no AnyDesk (mínimo 8 caracteres)'
        required: true
        default: 'SenhaForte123!'

jobs:
  build:
    name: Start Cloud PC
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Baixar e Instalar AnyDesk
        run: |
          Write-Host "Baixando instalador oficial do AnyDesk..."
          $installerPath = "$env:TEMP\AnyDesk.exe"
          $installDir = "C:\Program Files (x86)\AnyDesk"
          
          # Baixa direto do servidor oficial sem usar winget
          Invoke-WebRequest -Uri "https://anydesk.com" -OutFile $installerPath -UseBasicParsing
          
          Write-Host "Instalando o AnyDesk silenciosamente..."
          Start-Process -FilePath $installerPath -ArgumentList "--install `"$installDir`" --start-with-win --silent" -Wait
          Start-Sleep -Seconds 10

      - name: Configurar e Iniciar AnyDesk
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          
          if (-not (Test-Path $anydeskPath)) {
            Write-Error "ERRO: O executável do AnyDesk não foi encontrado em $anydeskPath."
            exit 1
          }

          # Inicia o serviço do AnyDesk
          Start-Process -FilePath $anydeskPath
          Start-Sleep -Seconds 10

          # Define a senha informada ao iniciar o workflow
          $senha = "${{ github.event.inputs.anydesk_password }}"
          echo $senha | & $anydeskPath --set-password
          Start-Sleep -Seconds 5

          # Obtém e exibe o ID no log do GitHub
          $id = & $anydeskPath --get-id
          Write-Host "=========================================="
          Write-Host "ANYDESK PRONTO PARA CONEXAO!"
          Write-Host "ID: $id"
          Write-Host "SENHA: $senha"
          Write-Host "=========================================="

      - name: Monitorar Sessão (Máximo 5h45m)
        run: |
          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          $tempoLimite = (Get-Date).AddMinutes(345)

          while ((Get-Date) -lt $tempoLimite) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $process) {
              Write-Host "AnyDesk fechou. Reiniciando..."
              Start-Process -FilePath $anydeskPath
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Tempo limite da sessão atingido. Encerrando."
